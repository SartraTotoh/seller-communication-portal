name: Comms P0 Source Sync Regression

on:
  pull_request:
    paths:
      - "app/public/index.html"
      - "app/tests/portal-sync-p0.test.cjs"
      - ".github/workflows/comms-p0-sync-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test source sync and JSONP fallback
        run: node --test app/tests/portal-sync-p0.test.cjs
