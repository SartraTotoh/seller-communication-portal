name: Comms Routing and Gateway Resilience Tests

on:
  pull_request:
    paths:
      - "app/integration/comms-navigation/**"
      - ".github/workflows/comms-navigation-gateway-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate deep links, stable Back and gateway failover
        run: node --test app/integration/comms-navigation/*.test.mjs
